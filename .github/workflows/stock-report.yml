name: Daily Stock Report

on:
  schedule:
    # Minute Hour Day Month Weekday, in UTC. 01:30 UTC Mon-Fri = 07:00 AM IST.
    # To change the time, edit this single line (see README "GitHub Actions schedules").
    - cron: "30 1 * * 1-5"
  workflow_dispatch: # manual run from the Actions tab, for testing and recovery

permissions:
  contents: read

concurrency:
  group: stock-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Remembers which trading session was already reported so reruns do not duplicate it.
      - name: Restore sent-history cache
        uses: actions/cache/restore@v4
        with:
          path: .stock_state
          key: stock-state-none
          restore-keys: stock-state-

      - name: Run stock report
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_STOCK_CHAT_ID: ${{ secrets.TELEGRAM_STOCK_CHAT_ID }}
          STOCK_WATCHLIST: ${{ vars.STOCK_WATCHLIST }}
        run: python -m stock_agent

      - name: Save sent-history cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .stock_state
          key: stock-state-${{ github.run_id }}
