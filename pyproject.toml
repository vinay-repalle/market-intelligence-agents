[project]
name = "ai-market-agent"
version = "1.0.0"
description = "Daily top-10 AI industry digest delivered to Telegram"
requires-python = ">=3.11"
dependencies = ["feedparser", "python-dotenv", "requests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # long feed URLs / regexes are clearer on one line

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["feedparser"]
ignore_missing_imports = true
